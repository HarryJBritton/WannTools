hamiltonian:
  hr_file: data/in/3R-TaSe2_hr.dat
  nnkp_file: data/in/3R-TaSe2.nnkp
  dtype: 64
  fermi_energy: 4.1834800790

kspace:

  type: path
  path:
    nps: 200
    space_group: '160'
    # path: [G, M, K, G]
    path: [<-M, K, Γ->]

  # type: surface
  # surface:
  #   n1: 81
  #   n2: 81
  #   level: 0
  #   fixed_axis: 2
  #   centre: K
  #   width: 0.2

calculation:
  type: band

  band:
    energy_min: 0.85
    energy_max: 0.9
    # energy_min: -1
    # energy_max: 2
    colour: red
    spin_projection: z


  # spectral:
  #   omega:
  #     mode: range #levels
  #     # levels: [8.1159948861]
  #     lower: 7.7
  #     upper: 8.4
  #     steps: 200
  #   eta: 0.01
  #   spin_projection: '0'
  #   layer_projection: 0

execution:
  backend: mpi
  ranks: 10
  chunk_size: 25

  #  TODO Optional resource constraints

