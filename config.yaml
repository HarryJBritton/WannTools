hamiltonian:
  hr_file: data/in/wannier90_hr.dat
  nnkp_file: data/in/PdBi2.nnkp
  dtype: 64
  finite:
    enabled: true
    layers: 20

kspace:
  type: path

  path:
    nps: 160
    path: [G, M]

  # surface:
  #   n1: 120
  #   n2: 120
  #   level: 0
  #   fixed_axis: 2

calculation:
  type: spectral

  spectral:
    omega:
      mode: range #levels
      # levels: [8.1159948861]
      lower: 7.7
      upper: 8.4
      steps: 200
    eta: 0.01
    spin_projection: '0'
    layer_projection: 0

execution:
  backend: mpi
  ranks: 16
  chunk_size: 1
  # TODO Optional resource constraints
  memory_limit_gb: 16
  time_limit_hours: null

output:
  directory: data/out
  save_data: true
  plot: true
  format: pdf # TODO

debug:
  enabled: true
  log_level: DEBUG
  log_chunks: true
  log_chunk_timing: true
  # limit_chunks: 10