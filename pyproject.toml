[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "WannTools"
version = "0.1.0"
description = "Tools for Wannier Hamiltonians and other Hamiltonians"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "PyYAML",
    "mpi4py"
]

[project.scripts]
wannrun = "wann_tools.cli:main"


[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]