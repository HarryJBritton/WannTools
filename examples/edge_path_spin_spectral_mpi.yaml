hamiltonian:
  hr_file: data/in/wannier90_hr.dat
  nnkp_file: data/in/PdBi2.nnkp
  dtype: 64
  finite:
    enabled: true
    layers: 40

kspace:
  type: path
  path:
    nps: 400
    path: [G, M]

calculation:
  type: spectral

  spectral:
    omega:
      mode: range
      lower: 7.78
      upper: 8.38
      steps: 200
    eta: 0.01
    spin_projection: '0'
    layer_projection: 0

execution:
  backend: mpi
  ranks: 4
  chunk_size: 20

output:
  directory: data/out
  save_data: true
  plot: true
  format: pdf

debug:
  enabled: true
  log_level: DEBUG
  log_chunks: true
  log_chunk_timing: true
  # limit_chunks: 10